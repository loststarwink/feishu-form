<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在打开表单...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f7f7f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 420px;
            width: 100%;
            padding: 40px 28px;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 44px 28px 36px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f5ff;
            border-radius: 50%;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e0e0e0;
            border-top-color: #4a7dff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .desc {
            font-size: 14px;
            color: #999;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-primary {
            display: block;
            width: 100%;
            height: 48px;
            line-height: 48px;
            background: #4a7dff;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary:active {
            background: #3a6ae8;
        }

        .btn-primary:visited {
            color: #fff;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #bbb;
            line-height: 1.5;
        }

        .auto-tip {
            font-size: 13px;
            color: #999;
            margin-top: 16px;
            display: none;
        }

        .auto-tip.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <div class="spinner"></div>
            </div>
            <div class="title">正在为您打开表单</div>
            <div class="desc">请稍候，正在跳转中...</div>
            <a href="https://my.feishu.cn/share/base/form/shrcncgov9zR7CBmsziAEY7wrpe" class="btn-primary" id="openLink">点击进入表单</a>
            <div class="auto-tip" id="autoTip">如未自动跳转，请点击上方按钮</div>
        </div>
        <div class="footer">
            若无法打开，请复制链接到浏览器中打开
        </div>
    </div>

    <script>
        (function() {
            var targetUrl = 'https://my.feishu.cn/share/base/form/shrcncgov9zR7CBmsziAEY7wrpe';

            // 判断是否在微信浏览器内
            var isWeChat = /MicroMessenger/i.test(navigator.userAgent);

            // 尝试自动跳转
            var timer = setTimeout(function() {
                // 微信内用 location.href 跳转（如果域名被拦会停在当前页）
                // 非微信浏览器直接跳转
                window.location.href = targetUrl;
            }, 1500);

            // 2秒后如果还在当前页，说明可能被拦截了，显示提示
            var tipTimer = setTimeout(function() {
                var tip = document.getElementById('autoTip');
                var spinner = document.querySelector('.spinner');
                var iconWrapper = document.querySelector('.icon-wrapper');
                if (tip) tip.classList.add('show');

                // 把 spinner 换成一个提示图标
                if (spinner && iconWrapper) {
                    iconWrapper.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93C7.05 19.44 4 16.08 4 12c0-.61.08-1.21.21-1.78L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41C17.93 5.78 20 8.65 20 12c0 2.08-.81 3.98-2.1 5.39z" fill="#4a7dff"/></svg>';
                }
            }, 3000);
        })();
    </script>
</body>
</html>
